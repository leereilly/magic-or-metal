<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic or Metal? — Social Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Metal+Mania&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .card {
      width: 1200px;
      height: 630px;
      background: linear-gradient(180deg, #141416 0%, #0a0a0c 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding-top: 28px;
      position: relative;
      z-index: 10;
    }
    .header h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 26px;
      color: #dc3545;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 17px;
      color: #d4cec5;
      font-weight: 400;
    }

    /* ── Main area ── */
    .main {
      flex: 1;
      display: flex;
      width: 100%;
      position: relative;
      z-index: 5;
    }

    /* ── Half panels ── */
    .half {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 16px;
      overflow: hidden;
    }

    /* ── Magic side background ── */
    .half-magic {
      background:
        radial-gradient(ellipse at 30% 60%, rgba(40, 55, 100, 0.4) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 20%, rgba(80, 100, 160, 0.15) 0%, transparent 50%),
        linear-gradient(180deg, #0d1020 0%, #0a0a0c 100%);
    }

    /* Rune marks on magic side */
    .half-magic::before {
      content: 'ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛈ ᛇ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛟ ᛞ';
      position: absolute;
      left: -20px;
      top: 40px;
      bottom: 0;
      width: 60px;
      font-size: 22px;
      color: rgba(100, 130, 200, 0.12);
      writing-mode: vertical-rl;
      letter-spacing: 6px;
      pointer-events: none;
      overflow: hidden;
    }

    /* Castle / tower silhouette on magic side */
    .half-magic::after {
      content: '';
      position: absolute;
      right: 0;
      bottom: 60px;
      width: 200px;
      height: 340px;
      background:
        linear-gradient(180deg, transparent 0%, rgba(20, 25, 50, 0.9) 30%, #0d1020 100%);
      clip-path: polygon(
        50% 0%, 55% 0%, 55% 15%, 70% 15%, 70% 20%, 60% 20%, 60% 35%,
        80% 35%, 80% 40%, 65% 40%, 65% 100%, 35% 100%, 35% 40%, 20% 40%,
        20% 35%, 40% 35%, 40% 20%, 30% 20%, 30% 15%, 45% 15%, 45% 0%
      );
      opacity: 0.25;
      pointer-events: none;
    }

    /* Moon on magic side */
    .moon {
      position: absolute;
      top: 10px;
      right: 30px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #c8cce0 0%, #8890aa 50%, rgba(100, 110, 140, 0.3) 100%);
      box-shadow: 0 0 30px rgba(150, 160, 200, 0.3), 0 0 60px rgba(150, 160, 200, 0.15);
      opacity: 0.7;
    }

    /* ── Metal side background ── */
    .half-metal {
      background:
        radial-gradient(ellipse at 70% 50%, rgba(180, 60, 20, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 30% 80%, rgba(220, 100, 30, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #1a0c08 0%, #0a0a0c 100%);
    }

    /* Fire glow on metal side */
    .half-metal::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 250px;
      height: 100%;
      background: radial-gradient(ellipse at 80% 30%, rgba(255, 120, 20, 0.2) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Amp stack silhouette */
    .half-metal::after {
      content: '';
      position: absolute;
      right: 10px;
      bottom: 60px;
      width: 120px;
      height: 280px;
      background: repeating-linear-gradient(
        180deg,
        rgba(40, 35, 30, 0.6) 0px,
        rgba(40, 35, 30, 0.6) 55px,
        rgba(30, 25, 20, 0.8) 55px,
        rgba(30, 25, 20, 0.8) 60px
      );
      border-radius: 4px;
      opacity: 0.3;
      pointer-events: none;
    }

    /* ── Crowd silhouette at bottom of metal side ── */
    .crowd {
      position: absolute;
      bottom: 50px;
      left: 0;
      right: 0;
      height: 50px;
      background:
        radial-gradient(ellipse at 10% 100%, #0a0a0c 0%, transparent 30%),
        radial-gradient(ellipse at 25% 100%, #0a0a0c 0%, transparent 25%),
        radial-gradient(ellipse at 40% 100%, #0a0a0c 0%, transparent 30%),
        radial-gradient(ellipse at 55% 100%, #0a0a0c 0%, transparent 25%),
        radial-gradient(ellipse at 70% 100%, #0a0a0c 0%, transparent 30%),
        radial-gradient(ellipse at 85% 100%, #0a0a0c 0%, transparent 25%),
        radial-gradient(ellipse at 95% 100%, #0a0a0c 0%, transparent 30%);
      opacity: 0.5;
      pointer-events: none;
    }

    /* ── Section labels ── */
    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      position: relative;
      z-index: 5;
    }
    .label-magic {
      font-family: 'MedievalSharp', serif;
      font-size: 42px;
      color: #c8c0a8;
      text-shadow: 0 0 20px rgba(200, 190, 160, 0.3);
      letter-spacing: 0.05em;
    }
    .label-metal {
      font-family: 'Metal Mania', cursive;
      font-size: 42px;
      color: #dc3545;
      font-style: italic;
      text-shadow: 0 0 20px rgba(220, 53, 69, 0.4), 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    /* Crossed swords icon */
    .swords {
      font-size: 36px;
      filter: grayscale(0.3) brightness(1.2);
    }

    /* ── Card frames ── */
    .card-frame {
      width: 340px;
      height: 310px;
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      border-radius: 14px;
    }

    /* Magic card — parchment style */
    .card-magic {
      background:
        radial-gradient(ellipse at 50% 30%, #f0e6c8 0%, #d4c8a0 40%, #b8a878 100%);
      border: 6px solid #4a3c28;
      box-shadow:
        inset 0 0 30px rgba(80, 60, 30, 0.3),
        0 0 30px rgba(0, 0, 0, 0.5),
        0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .card-magic::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 2px solid rgba(100, 80, 50, 0.3);
      border-radius: 8px;
      pointer-events: none;
    }

    .card-magic .card-name {
      font-family: 'MedievalSharp', serif;
      font-size: 42px;
      color: #2a2218;
      text-align: center;
      line-height: 1.15;
      margin-bottom: 24px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }
    .card-magic .card-question {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      color: #4a3c28;
      text-align: center;
      font-weight: 600;
    }

    /* Metal card — industrial/riveted metal plate */
    .card-metal {
      background:
        linear-gradient(145deg, #6a7080 0%, #4a5060 30%, #5a6070 50%, #3a4555 80%, #4a5565 100%);
      border: 6px solid #3a3a3a;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -2px 4px rgba(0, 0, 0, 0.3),
        0 0 30px rgba(0, 0, 0, 0.5),
        0 8px 32px rgba(0, 0, 0, 0.4);
    }

    /* Rivets on metal card */
    .card-metal::before,
    .card-metal::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #8a8a8a, #4a4a4a 60%, #3a3a3a);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.3), 0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .card-metal::before { top: 12px; left: 12px; }
    .card-metal::after { top: 12px; right: 12px; }
    .rivet-bl, .rivet-br {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #8a8a8a, #4a4a4a 60%, #3a3a3a);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.3), 0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .rivet-bl { bottom: 12px; left: 12px; }
    .rivet-br { bottom: 12px; right: 12px; }

    .card-metal .card-name {
      font-family: 'Metal Mania', cursive;
      font-size: 40px;
      color: #dc3545;
      text-align: center;
      line-height: 1.15;
      margin-bottom: 24px;
      text-shadow: 0 0 15px rgba(220, 53, 69, 0.5), 0 2px 4px rgba(0, 0, 0, 0.6);
      text-transform: uppercase;
    }
    .card-metal .card-question {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      color: #d0ccc5;
      text-align: center;
      font-weight: 600;
    }

    /* ── Play button ── */
    .play-btn-wrap {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }
    .play-btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.15em;
      color: #2a1f0a;
      background: linear-gradient(180deg, #e8d374 0%, #c9a84c 40%, #a8842f 100%);
      border: 2px solid #a8842f;
      border-radius: 40px;
      padding: 14px 60px;
      cursor: pointer;
      box-shadow:
        0 0 20px rgba(201, 168, 76, 0.4),
        0 4px 16px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
    }

    /* ── Footer ── */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding-bottom: 18px;
      z-index: 10;
    }
    .stats {
      font-size: 14px;
      color: #8b8680;
      margin-bottom: 8px;
    }
    .stats .dot {
      margin: 0 6px;
      opacity: 0.5;
    }
    .credits {
      font-size: 13px;
      color: #6b6560;
    }
    .credits a {
      color: #8b8680;
      text-decoration: none;
    }

    /* Star decoration */
    .star {
      position: absolute;
      bottom: 18px;
      right: 24px;
      font-size: 18px;
      color: rgba(200, 190, 170, 0.4);
      z-index: 10;
    }

    /* ── Divider line ── */
    .divider {
      position: absolute;
      top: 80px;
      left: 50%;
      width: 1px;
      height: calc(100% - 150px);
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.06) 20%, rgba(255, 255, 255, 0.06) 80%, transparent);
      z-index: 6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>The Ultimate Nerd Showdown!</h1>
      <p>Test Your Knowledge in the Hottest New Game!</p>
    </div>

    <div class="divider"></div>

    <div class="main">
      <!-- Magic side -->
      <div class="half half-magic">
        <div class="moon"></div>
        <div class="section-label">
          <span class="swords">⚔️</span>
          <span class="label-magic">MAGIC</span>
        </div>
        <div class="card-frame card-magic">
          <div class="card-name">Through<br>the Never</div>
          <div class="card-question">Is it a MTG Card?</div>
        </div>
      </div>

      <!-- Metal side -->
      <div class="half half-metal">
        <div class="crowd"></div>
        <div class="section-label">
          <span class="label-metal">METAL?</span>
        </div>
        <div class="card-frame card-metal">
          <span class="rivet-bl"></span>
          <span class="rivet-br"></span>
          <div class="card-name">Through<br>the Never</div>
          <div class="card-question">Is it a HEAVY METAL Song?</div>
        </div>
      </div>
    </div>

    <div class="play-btn-wrap">
      <button class="play-btn">PLAY</button>
    </div>

    <div class="footer">
      <div class="stats">
        <span>153 cards</span>
        <span class="dot">·</span>
        <span>133 songs</span>
      </div>
      <div class="credits">
        Cards via <a href="https://scryfall.com">Scryfall</a> ·
        Songs via <a href="https://musicbrainz.org">MusicBrainz</a>
      </div>
    </div>

    <div class="star">✦</div>
  </div>
</body>
</html>
